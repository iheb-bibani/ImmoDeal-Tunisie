name: Daily raw listing archive

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: immodeal-daily-raw-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Collect Tayara raw snapshots
        env:
          IMMODEAL_TAYARA_LIMIT: ${{ vars.IMMODEAL_TAYARA_LIMIT || '100' }}
          IMMODEAL_TAYARA_PAGES: ${{ vars.IMMODEAL_TAYARA_PAGES || '1' }}
          IMMODEAL_TAYARA_DELAY: ${{ vars.IMMODEAL_TAYARA_DELAY || '1.5' }}
        run: |
          immodeal collect-tayara \
            --db data/raw_metadata.db \
            --payload-root data/raw_payloads \
            --limit "$IMMODEAL_TAYARA_LIMIT" \
            --pages "$IMMODEAL_TAYARA_PAGES" \
            --delay "$IMMODEAL_TAYARA_DELAY"
      - name: Run tests
        run: pytest -q
      - name: Commit raw archive checkpoint
        run: |
          git config user.name "immodeal-bot"
          git config user.email "immodeal-bot@users.noreply.github.com"
          git add data/raw_metadata.db data/raw_payloads
          git diff --cached --quiet || git commit -m "data: daily raw listing archive"
          git pull --rebase
          git push
