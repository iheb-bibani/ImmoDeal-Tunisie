name: Bootstrap ImmoDeal V0.3

on:
  push:
    paths:
      - 'bootstrap_payload.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand project archive
        run: |
          base64 -d bootstrap_payload.b64 > /tmp/immodeal.zip
          rm -rf /tmp/immodeal_unpack
          mkdir -p /tmp/immodeal_unpack
          unzip -q /tmp/immodeal.zip -d /tmp/immodeal_unpack
          cp -a /tmp/immodeal_unpack/ImmoDeal-Tunisie/. .
      - name: Commit project
        run: |
          git config user.name "immodeal-bootstrap"
          git config user.email "immodeal-bootstrap@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: bootstrap ImmoDeal raw-first V0.3"
          git push
