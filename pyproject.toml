[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immodeal-tunisie"
version = "0.1.0"
description = "Data/ML platform for Tunisian real-estate opportunity detection"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[project.scripts]
immodeal = "immodeal.cli:main"
